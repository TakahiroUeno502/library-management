spring.application.name=library-management

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_management}
spring.datasource.username=${DB_USERNAME:library_user}
spring.datasource.password=${DB_PASSWORD:library_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.baseline-on-migrate=true


